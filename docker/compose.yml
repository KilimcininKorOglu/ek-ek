# Three node development cluster on one bridge network.
#
# Addresses are fixed and written here rather than assigned by Docker, because
# VRRP peers are configured as a unicast list and a moving address would make
# every test rewrite its own configuration.
#
# The nodes run as root. Docker grants added capabilities to the root user only;
# it does not set ambient capabilities, so a non-root process would lose
# CAP_NET_ADMIN the moment it started. In production systemd grants them
# ambiently to a non-root service user instead (T-060). Where a test writes into
# docker-data it drops to the host user with setpriv, so the bind mount does not
# fill up with root owned files.

name: ek-ek

x-node: &node
  build:
    context: ..
    dockerfile: docker/Dockerfile.dev
  image: ek-ek-dev:latest
  # Without an init, PID 1 is the idle command, which never reaps an orphan.
  # Orphaned children then pile up as zombies and look like a supervision bug
  # in whatever is being measured. In production systemd is PID 1 and does this.
  init: true
  cap_add:
    # Add a VIP to an interface and delete it again.
    - NET_ADMIN
    # Open a raw socket for VRRP advertisements and gratuitous ARP.
    - NET_RAW
  environment:
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}
  # A virtual address is only on the interface of the node that holds the
  # role, and every node's traffic path binds a listener to it. Docker mounts
  # /proc/sys read only, so the agent cannot set this itself here the way it
  # does on a real host; declaring it puts the same value in the container's
  # own network namespace (ADR-0087).
  sysctls:
    net.ipv4.ip_nonlocal_bind: "1"
  restart: "no"

services:
  node1:
    <<: *node
    container_name: ek-ek-node1
    hostname: node1
    # The lab's own name server. A node resolves the way it would in a network
    # with an internal zone, which is what makes the DNS-01 measurement real:
    # the record the product writes is the record it then looks up.
    dns:
      - 172.28.0.42
    depends_on:
      - bind
    volumes:
      - ../docker-data/node1:/var/lib/ek-ek
    networks:
      lab:
        ipv4_address: 172.28.0.11
        # A name with dots in it, because an ACME identifier is a domain name
        # and a single label is not one. Docker's own resolver answers it, so
        # the certificate authority container looks this node up the way a
        # real one looks up a customer's name.
        aliases:
          - node1.ek-ek.test

  node2:
    <<: *node
    container_name: ek-ek-node2
    hostname: node2
    dns:
      - 172.28.0.42
    depends_on:
      - bind
    volumes:
      - ../docker-data/node2:/var/lib/ek-ek
    networks:
      lab:
        ipv4_address: 172.28.0.12

  node3:
    <<: *node
    container_name: ek-ek-node3
    hostname: node3
    dns:
      - 172.28.0.42
    depends_on:
      - bind
    volumes:
      - ../docker-data/node3:/var/lib/ek-ek
    networks:
      lab:
        ipv4_address: 172.28.0.13

  # Compiles Linux binaries for the nodes. The integration harness drives it;
  # nothing else should. It idles until a build is asked for, and it keeps its
  # cargo cache and target directory on bind mounts so a rebuild is incremental.
  #
  # Only the files cargo needs are mounted, and read only. Mounting the whole
  # repository would pull docker-data back into the container underneath itself.
  builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.builder
    image: ek-ek-builder:latest
    container_name: ek-ek-builder
    hostname: builder
    restart: "no"
    init: true
    # The build drops to this user with setpriv, so the cargo cache and the
    # target directory stay owned by the host and `make dev-reset` can remove
    # them on Linux.
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ../Cargo.toml:/src/Cargo.toml:ro
      - ../Cargo.lock:/src/Cargo.lock:ro
      - ../rust-toolchain.toml:/src/rust-toolchain.toml:ro
      - ../crates:/src/crates:ro
      # The configuration crate embeds every translation file at build time
      # (ADR-0015), so without this its build script finds no directory and
      # nothing that depends on it compiles here at all.
      - ../locales:/src/locales:ro
      - ../docker-data/builder-cargo:/cargo
      - ../docker-data/builder-target:/target
    networks:
      lab:
        ipv4_address: 172.28.0.31

  backend1:
    image: nginx:1.27-alpine
    container_name: ek-ek-backend1
    hostname: backend1
    restart: "no"
    volumes:
      - ../docker-data/backend1:/usr/share/nginx/html:ro
    networks:
      lab:
        ipv4_address: 172.28.0.21

  backend2:
    image: nginx:1.27-alpine
    container_name: ek-ek-backend2
    hostname: backend2
    restart: "no"
    volumes:
      - ../docker-data/backend2:/usr/share/nginx/html:ro
    networks:
      lab:
        ipv4_address: 172.28.0.22

  # A real SMTP server, for measuring that the PROXY header the product writes
  # is accepted by software nobody here wrote and that the address it reads out
  # of it is the client's (ADR-0043). Port 25 expects the header, port 26 does
  # not, so one container covers both a configured and an unconfigured backend.
  mail:
    build:
      context: .
      dockerfile: Dockerfile.mail
    image: ek-ek-mail:latest
    container_name: ek-ek-mail
    hostname: mail
    restart: "no"
    init: true
    networks:
      lab:
        ipv4_address: 172.28.0.23

  # An ACME server, for measuring that the order flow this product wrote is
  # one a certificate authority accepts (T-027). Pebble is Let's Encrypt's own
  # test server and misbehaves on purpose: it rejects a share of the nonces it
  # issued and varies the order of what it returns, so a client that only
  # works against a well behaved server fails here.
  #
  # It must not be reachable from outside the lab. Nothing it issues is
  # trusted by anything, and its own key ships inside the image.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    container_name: ek-ek-pebble
    hostname: pebble
    restart: "no"
    init: true
    depends_on:
      - bind
    environment:
      # Validation runs immediately instead of after a random pause, so a
      # measurement waits on the product rather than on the test server.
      PEBBLE_VA_NOSLEEP: "1"
    # The lab's name server, not Docker's. A DNS-01 challenge is checked by
    # looking a record up, and the record this product writes lives in the
    # zone below. The zone also carries node1, so the HTTP-01 measurement
    # still finds the name it validates against.
    command:
      - -config
      - /test/config/pebble-config.json
      - -dnsserver
      - 172.28.0.42:53
    volumes:
      # Only to move the challenge check onto port 80. The shipped file uses
      # 5002, and the product listens where a real authority asks.
      - ./pebble/config.json:/test/config/pebble-config.json:ro
    networks:
      lab:
        ipv4_address: 172.28.0.41

  # The lab's name server, for measuring that the dynamic updates this product
  # writes are ones a real BIND accepts (T-028). It is authoritative for the
  # lab zone and forwards everything else, so a node pointed at it still finds
  # the other containers by name.
  #
  # The shared key is generated on every start and written to a bind mount for
  # whoever configures the client side. Nothing about it is tracked: a key in
  # the repository is a key published from the first commit.
  bind:
    build:
      context: .
      dockerfile: Dockerfile.bind
    image: ek-ek-bind:latest
    container_name: ek-ek-bind
    hostname: bind
    restart: "no"
    init: true
    environment:
      LAB_ZONE: ek-ek.test
      LAB_TSIG_KEY: ek-ek-update
      LAB_NODE1: 172.28.0.11
      LAB_SELF: 172.28.0.42
    volumes:
      - ../docker-data/bind:/shared
    networks:
      lab:
        ipv4_address: 172.28.0.42

  # systemd as PID 1, for the one question the rest of the lab cannot answer:
  # does the supervision work when systemd starts it, as a non-root user, with
  # the capabilities granted ambiently (ADR-0012, ADR-0087)?
  #
  # Docker grants added capabilities to root only. Everywhere else in this lab
  # the processes run as root for that reason, which means "it works with
  # NET_ADMIN" has only ever been measured for root. Here it is measured for
  # the service user the product actually ships under.
  #
  # cgroup access is what systemd needs to be PID 1 at all. It is granted read
  # and write here rather than by running the container privileged, so the
  # container still cannot reach the host's devices.
  systemd:
    build:
      context: .
      dockerfile: Dockerfile.systemd
    image: ek-ek-systemd:latest
    container_name: ek-ek-systemd
    hostname: systemd
    restart: "no"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # systemd is PID 1 here and writes its own cgroup hierarchy. Given the
    # host's rather than running the container privileged, so the container
    # still cannot reach the host's devices.
    cgroup: host
    # As for the other nodes, and for one more reason: here the agent runs as
    # a user with three capabilities and none of them is CAP_SYS_ADMIN, so it
    # could not write the knob even if /proc/sys were writable. On a real host
    # the installation sets it (T-060); this container cannot measure that
    # half, only the unit, the user, the capabilities and the supervision.
    sysctls:
      net.ipv4.ip_nonlocal_bind: "1"
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - ../docker-data/systemd:/opt/ek-ek
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    networks:
      lab:
        ipv4_address: 172.28.0.51

networks:
  lab:
    name: ek-ek-lab
    driver: bridge
    ipam:
      config:
        # 172.28.0.100 to 172.28.0.110 is left unassigned and reserved for VIP
        # tests. Nothing else may take an address from that range.
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
