# Throwaway spike for T-009. Not part of the workspace and not product code.
#
# It answers one question: can a supervising process replace a pingora process
# on a listener change without dropping a request and without interrupting work
# that must never stop. ADR-0002 depends on the answer.
[workspace]

[package]
name = "spike-upgrade"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
pingora = { version = "0.8", features = ["lb"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

[[bin]]
name = "proxy"
path = "src/bin/proxy.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "load"
path = "src/bin/load.rs"

[[bin]]
name = "long"
path = "src/bin/long.rs"
