[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Kerem Gok"]

[workspace.lints.rust]
# `unsafe` is denied rather than forbidden, because ek-ek-vrrp may need a raw
# socket call that no safe wrapper covers. Opening it must be a deliberate,
# reviewed `#[allow]` on the smallest possible scope, never a project default.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# A panic in a load balancer drops live traffic. Outside tests, propagate the
# error with `Result` and `?` instead.
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The logging facade pingora already writes through, so one installed logger
# captures its records as well as ours (ADR-0037).
log = "0.4"
# Timestamps only. Already in the tree through pingora, so this adds no new
# supply chain surface.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# SQLite is bundled rather than linked against a system library, so a package
# cannot land on a host whose libsqlite3 is too old for the schema.
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
# Authenticated encryption: the extended nonce is large enough to be drawn at
# random for every record without tracking a counter.
chacha20poly1305 = "0.11"
getrandom = "0.4"
tempfile = "3"

# OpenSSL rather than rustls: pingora's rustls backend refuses certificate
# callbacks, and choosing a certificate per handshake from the SNI name is
# what dynamic certificate resolution is (ADR-0068).
pingora = { version = "0.8", default-features = false, features = ["openssl", "proxy", "lb"] }
arc-swap = "1"
# The buffer type pingora writes a response body from. Already in the tree
# through pingora itself, so naming it adds no supply chain surface; pingora
# does not re-export it, and the traffic path answers the ACME challenge with
# a body of its own.
bytes = "1"
async-trait = "0.1"
# Async TLS on top of the same openssl the rest of the tree speaks. The peer
# channel carries Raft, so both ends have to be async, and a second TLS stack
# is what ADR-0068 rules out.
tokio-openssl = "0.6"
# The consensus library the control plane runs on (ADR-0004). Pinned to the
# last stable line: 0.10 is still alpha and a consensus API that moves with
# every alpha is not one to build config replication on (ADR-0083).
# `storage-v2` is what lets a crate outside openraft implement the storage
# traits at all; without it they are sealed.
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
# The library pingora's openssl backend already uses, so both sides of a
# handshake agree on what a certificate is (ADR-0068). A dev-dependency
# wherever tests build certificates and speak TLS from the client side, and a
# real dependency of ek-ek-tls, which inspects what an operator uploads.
openssl = "0.10"
# The HTTP client the ACME order flow speaks over. Blocking, so the control
# plane needs no async runtime for it, and pointed at the native TLS provider
# so the tree keeps one TLS stack rather than gaining rustls beside openssl
# (ADR-0068).
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
# UDP listeners need SO_REUSEPORT so a replacement process can bind the port
# the old one is still serving. The standard library has no way to set a
# socket option before bind.
socket2 = { version = "0.6", features = ["all"] }
# Two kernel address structures socket2 does not model: the one that names
# which interface a raw frame leaves from, and the storage it is copied into.
# Already in the tree through socket2 itself, so it adds no supply chain
# surface (ADR-0073).
libc = "0.2"
# The stickiness cookie is a keyed hash, so the traffic path needs an HMAC.
# RustCrypto rather than a TLS library's own: the crates are already in the
# tree through chacha20poly1305 and carry no C code.
hmac = "0.13"
sha2 = "0.11"
http = "1"
# Only a test dependency: the HTTP/2 client that proves the h2c listener
# answers. Pinned to the version pingora already builds, so it costs no extra
# compilation.
h2 = "0.4"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

# Layer boundaries are enforced by the dependency direction between crates.
# ek-ek-config depends on no workspace crate.
# ek-ek-dataplane and ek-ek-vrrp never depend on each other.
ek-ek-agent = { path = "crates/ek-ek-agent" }
ek-ek-api = { path = "crates/ek-ek-api" }
ek-ek-config = { path = "crates/ek-ek-config" }
ek-ek-dataplane = { path = "crates/ek-ek-dataplane" }
ek-ek-ipc = { path = "crates/ek-ek-ipc" }
ek-ek-log = { path = "crates/ek-ek-log" }
# Peer trust and the certificates an operator uploads are separate trust
# domains (ADR-0008), so ek-ek-peer and ek-ek-tls never depend on each other.
ek-ek-peer = { path = "crates/ek-ek-peer" }
ek-ek-raft = { path = "crates/ek-ek-raft" }
ek-ek-store = { path = "crates/ek-ek-store" }
ek-ek-tls = { path = "crates/ek-ek-tls" }
ek-ek-vrrp = { path = "crates/ek-ek-vrrp" }
