[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Kerem Gok"]

[workspace.lints.rust]
# `unsafe` is denied rather than forbidden, because ek-ek-vrrp may need a raw
# socket call that no safe wrapper covers. Opening it must be a deliberate,
# reviewed `#[allow]` on the smallest possible scope, never a project default.
unsafe_code = "deny"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# A panic in a load balancer drops live traffic. Outside tests, propagate the
# error with `Result` and `?` instead.
unwrap_used = "deny"
expect_used = "deny"
todo = "warn"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SQLite is bundled rather than linked against a system library, so a package
# cannot land on a host whose libsqlite3 is too old for the schema.
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
# Authenticated encryption: the extended nonce is large enough to be drawn at
# random for every record without tracking a counter.
chacha20poly1305 = "0.11"
getrandom = "0.4"
tempfile = "3"

# Layer boundaries are enforced by the dependency direction between crates.
# ek-ek-config depends on no workspace crate.
# ek-ek-dataplane and ek-ek-vrrp never depend on each other.
ek-ek-agent = { path = "crates/ek-ek-agent" }
ek-ek-api = { path = "crates/ek-ek-api" }
ek-ek-config = { path = "crates/ek-ek-config" }
ek-ek-dataplane = { path = "crates/ek-ek-dataplane" }
ek-ek-ipc = { path = "crates/ek-ek-ipc" }
ek-ek-store = { path = "crates/ek-ek-store" }
ek-ek-vrrp = { path = "crates/ek-ek-vrrp" }
