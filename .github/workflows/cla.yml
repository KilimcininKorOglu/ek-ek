name: cla

# Blocks a pull request until its author has signed the CLA.
#
# One merged contribution without the necessary rights ends the commercial
# license permanently, for everyone, and deleting the code afterwards does not
# undo it (R-17). So this runs as a required check rather than as a reminder.
#
# It is an action, not an installed GitHub App: the whole mechanism lives in
# this repository and can be read here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    # The comment trigger fires on every issue comment in the repository. Only
    # a signature comment on a pull request is relevant.
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/KilimcininKorOglu/ek-ek/blob/main/CLA.md
          # Signatures live in a branch of their own, so recording one never
          # touches the source tree or triggers the other workflows.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          # The project owner holds the copyright and cannot sign an agreement
          # with themselves.
          allowlist: cla-test-placeholder-do-not-keep
          custom-notsigned-prcomment: >
            Thank you for the pull request. Before it can be merged, please read
            the [Contributor License Agreement](https://github.com/KilimcininKorOglu/ek-ek/blob/main/CLA.md)
            ([Türkçe](https://github.com/KilimcininKorOglu/ek-ek/blob/main/CLA.tr.md))
            and sign it by posting the sentence below as a comment.


            ek-ek is offered under AGPL-3.0-or-later and under separate
            commercial terms. Merging a contribution that does not carry the
            necessary rights would end the commercial license permanently, so
            this signature is required and not a formality.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "Every contributor to this pull request has signed the CLA."
