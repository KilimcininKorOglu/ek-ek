[package]
name = "ek-ek"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Never published to a registry; the product ships as a distribution package.
publish = false
description = "Load balancer with built-in high availability"

[[bin]]
name = "ek-ek"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# `matrix` answers which node should hold which address. The answer is a pure
# function of the configuration, so the command needs the model and nothing
# else: no cluster, no network and no running agent.
ek-ek-config = { workspace = true }
# `node-agent` supervises the traffic path and hosts the virtual router beside
# it (ADR-0002, ADR-0087).
ek-ek-agent = { workspace = true }
ek-ek-dataplane = { workspace = true }
ek-ek-log = { workspace = true }
ek-ek-ipc = { workspace = true }
# `acme` obtains a certificate and files it. The order flow and the store are
# what it needs; the traffic path is a separate process and is not involved.
# `cluster` creates the authority every node's peer certificate comes from and
# opens the channel those certificates authenticate.
ek-ek-peer = { workspace = true }
# `cluster node` is the process that carries consensus. Nothing else in this
# binary links it, and the traffic path is a separate process that must never
# wait on a quorum (ADR-0004, ADR-0085).
ek-ek-raft = { workspace = true }
ek-ek-store = { workspace = true }
ek-ek-tls = { workspace = true }
# `acme` reads its own listener back before telling the certificate authority
# to come and check it. Nothing else here speaks HTTP as a client.
ureq = { workspace = true }
# The configuration document on disk is JSON, and `matrix` reads one.
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
h2 = { workspace = true }
# The harness reads the log the way a collector would: as JSON off the bytes
# the process wrote, never as a value one of our own functions returned.
serde_json = { workspace = true }
http = { workspace = true }
openssl = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
