[package]
name = "ek-ek-itest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Never published to a registry; the product ships as a distribution package.
publish = false
description = "Integration test harness for the three node docker cluster"

# Must depend on no product crate. The harness drives the cluster from outside
# and observes it the way an operator would, so a change in a product crate can
# never quietly change what the tests measure (ADR-0014).
[dependencies]

# Only the measurements use this, never the binaries that run inside a node.
# A record written to stdout is read by parsing the line, which also measures
# that it is JSON at all; a substring match would pass against a line nothing
# can parse (ADR-0037).
[dev-dependencies]
serde_json = { workspace = true }

# Runs inside a node container, so it must not pull in anything the harness
# needs on the host side.
[[bin]]
name = "ek-ek-loadgen"
path = "src/bin/ek-ek-loadgen.rs"

# Stands in for node-agent, which is not written yet, so a test can run the
# real traffic path inside a node container.
[[bin]]
name = "ek-ek-standin-agent"
path = "src/bin/ek-ek-standin-agent.rs"

[lints]
workspace = true
