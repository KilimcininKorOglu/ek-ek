[package]
name = "ek-ek-vrrp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Never published to a registry; the product ships as a distribution package.
publish = false
description = "VRRP state machine, VIP management and gratuitous ARP"

[[bin]]
# Runs one virtual router from its arguments, which is what the two node
# measurement needs on each side. Never packaged: the product ships `ek-ek`.
name = "ek-ek-vrrp-node"
path = "src/bin/ek-ek-vrrp-node.rs"

# Must never depend on ek-ek-dataplane (ADR-0014).
[dependencies]

# The sockets only exist on Linux, and so do the capabilities they need.
[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { workspace = true }
# Only for the address that names which interface a raw frame leaves from.
libc = { workspace = true }

[lints]
workspace = true
