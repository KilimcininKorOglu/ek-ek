# Dependency policy. Run with `cargo deny check`.
#
# The project is AGPL-3.0-or-later (ADR-0011, ADR-0056). A dependency whose
# license cannot be combined into an AGPL work makes the product undistributable,
# and finding that out at release time is too late. This file is the enforcement
# point.

[graph]
# The product only ships on Linux (ADR-0007), so the dependency graph is
# evaluated for the platforms it actually runs on.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# A known vulnerability or a yanked crate fails the check. Every exception is
# listed here with a reason, so silent exceptions cannot accumulate.
ignore = []

[licenses]
# Only licenses whose code can be combined into an AGPL-3.0 work.
# GPL-2.0-only is deliberately absent: it is incompatible with AGPL-3.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []
# The allow list is kept ahead of what the graph currently uses, so adding a
# dependency does not require editing policy in the same change.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are AGPL-3.0-or-later and are marked `publish = false`, so they
# are skipped here. AGPL is deliberately absent from the allow list above. It is
# no longer a legal problem now that nothing is sold under other terms
# (ADR-0056), but a narrow allow list keeps the dependency surface visible. If a
# needed dependency turns out to be AGPL, open it with its own decision.
ignore = true

[bans]
multiple-versions = "warn"
# A `*` version requirement makes the build non-reproducible.
wildcards = "deny"
# A path dependency inside this workspace carries no version requirement and
# so reads as a wildcard. It is pinned by the checkout rather than by a
# registry, and every crate here is `publish = false`, so the reproducibility
# argument does not apply to it. Registry dependencies stay under the rule.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
# Anything outside crates.io is a supply chain question, so it must be a
# deliberate, listed decision rather than a silent one.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
